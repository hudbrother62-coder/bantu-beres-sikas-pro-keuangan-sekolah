name: Apply team UI enhancement

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enhance-team-ui.mjs'
      - '.github/workflows/apply-team-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: apply team UI enhancement') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/enhance-team-ui.mjs
      - name: Commit patched app
        run: |
          if git diff --quiet -- src/components/sikas-app.tsx; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/sikas-app.tsx
          git commit -m 'chore: apply team UI enhancement'
          git push
